name: Publish Agent Relay

on:
  push:
    tags:
      - "v*"
    branches:
      - "release/v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Select the release tag
        id: target
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#release/}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.target.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.10"
      - name: Verify and build the wheel
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.target.outputs.tag }}
        run: |
          version=$(python -c 'from agent_relay import __version__; print(__version__)')
          test "$RELEASE_TAG" = "v$version"
          python -W error::ResourceWarning -m unittest discover -s tests -v
          python -m pip wheel --no-deps --wheel-dir dist .
          filename="agent_relay-$version-py3-none-any.whl"
          (cd dist && sha256sum "$filename") > "dist/$filename.sha256"
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.target.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.whl dist/*.whl.sha256 \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "Agent Relay ${RELEASE_TAG#v}" \
            --notes "Install the wheel with Python 3.10 or later. The companion SHA-256 file identifies the exact release artifact."
